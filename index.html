<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Envíos y Devoluciones</title>
    <style>
        :root {
            --bg-dark: #121212; --card-bg: #1e1e1e; --text-main: #e0e0e0;
            --text-muted: #a0a0a0; --accent: #007acc; --accent-hover: #005f9e;
            --border: #333; --danger: #cf6679; --success: #4caf50; --warning: #ffb300;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
        
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 12px; background: var(--card-bg); color: var(--text-main); border: 1px solid var(--border); border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .tab-btn.active, .tab-btn:hover { background: var(--accent); border-color: var(--accent); }
        .tab-content { display: none; background: var(--card-bg); padding: 20px; border-radius: 8px; }
        .tab-content.active { display: block; }

        /* Tarjetas de Inicio */
        .grid-pedidos { display: grid; gap: 15px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
        .card { background: var(--bg-dark); border: 1px solid var(--border); border-radius: 8px; padding: 15px; position: relative; }
        .card h3 { color: var(--accent); margin-bottom: 10px; }
        .card p { font-size: 0.9em; margin-bottom: 5px; color: var(--text-muted); }
        .card strong { color: var(--text-main); }
        .badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 0.8em; font-weight: bold; margin-bottom: 10px; }
        .badge.espera { background: var(--warning); color: #000; }
        .badge.salida { background: var(--success); color: #fff; }
        .badge.nolleva { background: var(--danger); color: #fff; }
        
        /* Formularios */
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 0.9em; color: var(--text-muted); }
        input, textarea, select { width: 100%; padding: 10px; background: var(--bg-dark); border: 1px solid var(--border); color: var(--text-main); border-radius: 6px; }
        button { padding: 10px 15px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; color: white; transition: 0.2s; }
        .btn-primary { background: var(--accent); width: 100%; }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-success { background: var(--success); }
        .btn-danger { background: var(--danger); margin-top: 10px; }
        
        /* Reportes */
        .filters { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .filters .form-group { flex: 1; min-width: 150px; margin-bottom: 0; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85em; margin-top: 15px; }
        th, td { border: 1px solid var(--border); padding: 8px; text-align: left; }
        th { background: var(--bg-dark); color: var(--accent); }
        
        #loader { text-align: center; padding: 20px; display: none; color: var(--accent); font-weight: bold; }
        
        @media print {
            body { background: white; color: black; padding: 0; }
            .header button, .tabs, .filters button, #loader { display: none !important; }
            .tab-content { padding: 0; background: transparent; }
            th { background: #eee; color: black; }
            th, td { border: 1px solid black; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>🚚 Logística y Devoluciones</h2>
        <button class="btn-primary" style="width: auto;" onclick="cargarDatos()">🔄 Sincronizar</button>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('inicio')">Inicio (Hoy)</button>
        <button class="tab-btn" onclick="switchTab('registro')">+ Nuevo Pedido</button>
        <button class="tab-btn" onclick="switchTab('reportes')">Reportes</button>
    </div>
    
    <div id="loader">Sincronizando con la base de datos...</div>

    <!-- INICIO (HOY) -->
    <div id="inicio" class="tab-content active">
        
        <!-- Tarjetas de Estadísticas -->
        <div style="display: flex; gap: 15px; margin-bottom: 20px;">
            <div class="card" style="flex: 1; text-align: center; border-color: var(--accent);">
                <h4 style="color: var(--text-muted); margin-bottom: 5px;">Efectividad Semanal</h4>
                <h2 id="stat_semana" style="color: var(--success); font-size: 2em;">0%</h2>
                <small id="text_semana">0 de 0 completados</small>
            </div>
            <div class="card" style="flex: 1; text-align: center; border-color: var(--accent);">
                <h4 style="color: var(--text-muted); margin-bottom: 5px;">Efectividad Mensual</h4>
                <h2 id="stat_mes" style="color: var(--success); font-size: 2em;">0%</h2>
                <small id="text_mes">0 de 0 completados</small>
            </div>
        </div>

        <!-- Grilla de Pedidos de Hoy -->
        <div class="grid-pedidos" id="contenedor_hoy">
            <!-- Las tarjetas se generan aquí automáticamente -->
        </div>
    </div>

    <!-- NUEVO REGISTRO -->
    <div id="registro" class="tab-content">
        <form id="formPedido">
            <div class="form-group"><label>N° Planilla</label><input type="text" id="n_planilla" required placeholder="Ej. PL-1234"></div>
            <div class="form-group"><label>Cliente</label><input type="text" id="cliente" required placeholder="Nombre del cliente"></div>
            <div class="form-group"><label>Chofer</label><input type="text" id="chofer" required placeholder="Nombre del conductor"></div>
            <div class="form-group"><label>Factura o Remisión</label><input type="text" id="factura" required placeholder="N° de comprobante"></div>
            <button type="submit" class="btn-primary" style="margin-top: 10px;">Registrar Ingreso a Planilla</button>
        </form>
    </div>

    <!-- REPORTES -->
    <div id="reportes" class="tab-content">
        <div class="filters">
            <div class="form-group"><label>Buscar Cliente</label><input type="text" id="filtro_cliente" onkeyup="filtrarReporte()" placeholder="Ej. Vidrios SA"></div>
            <div class="form-group"><label>Fecha Exacta</label><input type="date" id="filtro_fecha" onchange="filtrarReporte()"></div>
            <button class="btn-success" onclick="window.print()" style="align-self: flex-end;">🖨️ Imprimir</button>
        </div>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>N° Planilla</th>
                        <th>Cliente</th>
                        <th>Chofer</th>
                        <th>Factura</th>
                        <th>Estado</th>
                        <th>Observación</th>
                        <th>Entregado</th>
                    </tr>
                </thead>
                <tbody id="tabla_reporte"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // URL de tu Google Apps Script
    const API_URL = "https://script.google.com/macros/s/AKfycbwAUq4YEr2U_67lJsYggD7umo5Xh6ljv1keIx5J6PHcZ1MYR2qIIkQKcotQtxjGz7rPBw/exec"; 
    
    let datosGlobales = [];

    // Función para alternar entre pestañas
    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        event.currentTarget.classList.add('active');
        if(tabId === 'inicio') renderizarHoy();
        if(tabId === 'reportes') filtrarReporte();
    }

    // Funciones de tiempo
    function obtenerHora() {
        const d = new Date();
        return d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');
    }
    function obtenerFecha() {
        return new Date().toISOString().split('T')[0];
    }

    // Descargar datos desde Google Sheets
    async function cargarDatos() {
        document.getElementById('loader').style.display = 'block';
        try {
            const resp = await fetch(API_URL);
            datosGlobales = await resp.json();
            renderizarHoy();
            calcularEstadisticas();
            filtrarReporte();
        } catch (error) {
            console.error("Error al sincronizar:", error);
        }
        document.getElementById('loader').style.display = 'none';
    }

    // Calcular estadísticas (Semana y Mes)
    function calcularEstadisticas() {
        const hoy = new Date();
        
        // Calcular inicio de mes
        const inicioMes = new Date(hoy.getFullYear(), hoy.getMonth(), 1).toISOString().split('T')[0];
        
        // Calcular inicio de semana (Lunes)
        const diaSemana = hoy.getDay() || 7; 
        const inicioSemana = new Date(hoy);
        inicioSemana.setDate(hoy.getDate() - diaSemana + 1);
        const inicioSemanaStr = inicioSemana.toISOString().split('T')[0];

        let totalSemana = 0, entregadosSemana = 0;
        let totalMes = 0, entregadosMes = 0;

        datosGlobales.forEach(p => {
            if (p.fecha >= inicioMes) {
                totalMes++;
                if (p.estado === 'Se cargó') entregadosMes++;
            }
            if (p.fecha >= inicioSemanaStr) {
                totalSemana++;
                if (p.estado === 'Se cargó') entregadosSemana++;
            }
        });

        const porcSemana = totalSemana === 0 ? 0 : Math.round((entregadosSemana / totalSemana) * 100);
        const porcMes = totalMes === 0 ? 0 : Math.round((entregadosMes / totalMes) * 100);

        document.getElementById('stat_semana').innerText = porcSemana + "%";
        document.getElementById('text_semana').innerText = `${entregadosSemana} de ${totalSemana} completados`;
        
        document.getElementById('stat_mes').innerText = porcMes + "%";
        document.getElementById('text_mes').innerText = `${entregadosMes} de ${totalMes} completados`;
    }

    // Dibujar las tarjetas del día actual
    function renderizarHoy() {
        const hoy = obtenerFecha();
        const contenedor = document.getElementById('contenedor_hoy');
        contenedor.innerHTML = '';
        
        const pedidosHoy = datosGlobales.filter(p => p.fecha === hoy);
        
        if(pedidosHoy.length === 0) {
            contenedor.innerHTML = '<p style="color:var(--text-muted); grid-column: 1/-1;">No hay registros cargados para el día de hoy.</p>';
            return;
        }

        pedidosHoy.reverse().forEach(p => {
            let badgeClass = p.estado === 'En espera' ? 'espera' : (p.estado === 'Se cargó' ? 'salida' : 'nolleva');
            let html = `
                <div class="card">
                    <span class="badge ${badgeClass}">${p.estado}</span>
                    <h3>Planilla: ${p.n_planilla}</h3>
                    <p><strong>Cliente:</strong> ${p.cliente}</p>
                    <p><strong>Chofer:</strong> ${p.chofer}</p>
                    <p><strong>Factura:</strong> ${p.factura}</p>
                    <p>🕒 <strong>Agregado:</strong> ${p.hora_agregado}</p>
                    ${p.hora_salida ? `<p>✅ <strong>Salida:</strong> ${p.hora_salida}</p>` : ''}
            `;
            
            // Botones solo si está en espera
            if(p.estado === 'En espera') {
                html += `
                    <div style="margin-top: 15px; border-top: 1px solid var(--border); padding-top: 10px;">
                        <button class="btn-success" style="width:100%; margin-bottom:5px;" onclick="marcarSalida('${p.id}', 'Se cargó')">✔️ Confirmar que se cargó y salió</button>
                        <button class="btn-danger" style="width:100%; margin-top:0;" onclick="marcarSalida('${p.id}', 'No se llevó')">❌ No se llevó</button>
                    </div>
                `;
            }
            html += `</div>`;
            contenedor.innerHTML += html;
        });
    }

    // Enviar nuevo pedido a Google Sheets
    document.getElementById('formPedido').addEventListener('submit', function(e) {
        e.preventDefault();
        const data = {
            action: "add",
            id: "ID-" + Date.now(),
            fecha: obtenerFecha(),
            hora_agregado: obtenerHora(),
            n_planilla: document.getElementById('n_planilla').value,
            cliente: document.getElementById('cliente').value,
            chofer: document.getElementById('chofer').value,
            factura: document.getElementById('factura').value,
            observacion: ""
        };

        // Guardado visual rápido
        datosGlobales.push({...data, estado: "En espera", hora_salida: "", entregado: "Pendiente"});
        this.reset();
        switchTab('inicio');
        
        // Enviar a Sheets
        fetch(API_URL, { method: 'POST', body: JSON.stringify(data) })
            .then(() => cargarDatos());
    });

    // Actualizar estado de salida
    function marcarSalida(id, estado) {
        let obs = "";
        let statusEntregado = "Pendiente";
        
        if (estado === "No se llevó") {
            obs = prompt("Indica el motivo por el cual no se llevó la mercadería:");
            if (obs === null) return; // Si cancela el prompt
            statusEntregado = "No";
        } else if (estado === "Se cargó") {
            statusEntregado = "Sí";
        }
        
        const dataUpdate = {
            action: "update_salida",
            id: id,
            estado: estado,
            hora_salida: obtenerHora(),
            observacion: obs,
            entregado: statusEntregado
        };

        // Reflejar cambio visualmente de inmediato
        let item = datosGlobales.find(x => x.id === id);
        if(item) {
            item.estado = estado;
            item.hora_salida = dataUpdate.hora_salida;
            item.observacion = obs;
            item.entregado = statusEntregado;
            renderizarHoy();
            calcularEstadisticas();
        }

        // Enviar a Sheets
        fetch(API_URL, { method: 'POST', body: JSON.stringify(dataUpdate) })
            .then(() => cargarDatos());
    }

    // Cargar la tabla de reportes
    function filtrarReporte() {
        const txtCliente = document.getElementById('filtro_cliente').value.toLowerCase();
        const dateFiltro = document.getElementById('filtro_fecha').value;
        const tbody = document.getElementById('tabla_reporte');
        tbody.innerHTML = '';

        const filtrados = datosGlobales.filter(p => {
            const matchCliente = p.cliente.toLowerCase().includes(txtCliente);
            const matchFecha = dateFiltro ? (p.fecha === dateFiltro) : true;
            return matchCliente && matchFecha;
        });

        filtrados.forEach(p => {
            // Se renderizan solo las 8 columnas solicitadas
            tbody.innerHTML += `
                <tr>
                    <td style="white-space:nowrap;">${p.fecha.split('-').reverse().join('/')}</td>
                    <td><b>${p.n_planilla}</b></td>
                    <td>${p.cliente}</td>
                    <td>${p.chofer}</td>
                    <td>${p.factura}</td>
                    <td>${p.estado}</td>
                    <td>${p.observacion || '-'}</td>
                    <td><b>${p.entregado || '-'}</b></td>
                </tr>
            `;
        });
    }

    // Inicializar datos al cargar la página
    window.onload = cargarDatos;

</script>
</body>
</html>
